spring:
  application:
    name: jpetstore-test

  datasource:
    url: jdbc:mysql://localhost:3306/jpetstore?useUnicode=true&characterEncoding=utf-8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
    username: root
    password: 123456
    driver-class-name: com.mysql.cj.jdbc.Driver

  sql:
    init:
      mode: never

mybatis-plus:
  global-config:
    db-config:
      id-type: auto
      table-underline: true
  mapper-locations: classpath:mapper/*.xml
  type-aliases-package: com.jpetstore.domain
  configuration:
    map-underscore-to-camel-case: true

logging:
  level:
    com.jpetstore.mapper: debug

# AI Chatbot Configuration
chatbot:
  api:
    enabled: true
    url: https://api.openai.com/v1/chat/completions
    key: sk-bd945e4b9b1f4e9791b29390b14aff0e
    model: gpt-3.5-turbo

# JWT Configuration
jwt:
  secret: jpetstore-secret-key-change-in-production-2026
  expiration: 86400000

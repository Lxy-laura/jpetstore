<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>后台管理 - JPetStore</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
    <style>
        .sidebar { min-height: calc(100vh - 56px); }
        .sidebar a:hover { background-color: rgba(255,255,255,0.1); }
        .content-area { min-height: calc(100vh - 56px); }
        .stat-card { transition: transform 0.2s; }
        .stat-card:hover { transform: translateY(-2px); }
        .product-img-thumb { width: 50px; height: 50px; object-fit: cover; border-radius: 6px; }
        .banner-img-thumb { width: 120px; height: 60px; object-fit: cover; border-radius: 6px; }
    </style>
</head><body>
<nav class="navbar navbar-expand-lg navbar-dark bg-primary shadow-sm">
    <div class="container-fluid">
        <a class="navbar-brand fw-bold" th:href="@{/}"><i class="bi bi-paw-fill me-2"></i>JPetStore 后台管理</a>
        <div class="navbar-nav ms-auto">
            <span class="nav-link text-light"><i class="bi bi-person-circle me-1"></i><span th:text="${session.user.firstname}"></span> <span class="badge bg-danger">管理员</span></span>
            <form th:action="@{/logout}" method="post" class="d-inline">
                <button type="submit" class="nav-link btn btn-link text-light"><i class="bi bi-box-arrow-right me-1"></i>退出</button>
            </form>
        </div>
    </div>
</nav>
<div class="row g-0">
    <div class="col-md-2 bg-dark text-white sidebar">
        <div class="p-4">
            <h5 class="mb-4"><i class="bi bi-grid-3x3-gap me-2"></i>管理菜单</h5>
            <ul class="nav flex-column">
                <li class="nav-item mb-1"><a href="#dashboard" class="nav-link text-white active" data-section="dashboard"><i class="bi bi-speedometer2 me-2"></i>仪表盘</a></li>
                <li class="nav-item mb-1"><a href="#categories" class="nav-link text-white" data-section="categories"><i class="bi bi-grid me-2"></i>分类管理</a></li>
                <li class="nav-item mb-1"><a href="#products" class="nav-link text-white" data-section="products"><i class="bi bi-box-seam me-2"></i>产品管理</a></li>
                <li class="nav-item mb-1"><a href="#banners" class="nav-link text-white" data-section="banners"><i class="bi bi-images me-2"></i>轮播图管理</a></li>
                <li class="nav-item mb-1"><a href="#orders" class="nav-link text-white" data-section="orders"><i class="bi bi-receipt me-2"></i>订单管理</a></li>
                <li class="nav-item mb-1"><a href="#users" class="nav-link text-white" data-section="users"><i class="bi bi-people me-2"></i>用户管理</a></li>
                <hr class="my-3">
                <li class="nav-item"><a th:href="@{/}" class="nav-link text-white"><i class="bi bi-arrow-left me-2"></i>返回前台</a></li>
            </ul>
        </div>
    </div>
    <div class="col-md-10 content-area bg-light">
        <div class="p-4">
            <div id="section-dashboard" class="content-section">
                <h2 class="mb-4"><i class="bi bi-speedometer2 me-2"></i>仪表盘</h2>
                <div class="row g-4">
                    <div class="col-md-3"><div class="card stat-card bg-primary text-white"><div class="card-body"><div class="float-end"><i class="bi bi-grid opacity-50" style="font-size: 2rem;"></i></div><h6 class="text-white-80">分类数量</h6><h3 class="fw-bold" th:text="${categoryCount}">0</h3></div></div></div>
                    <div class="col-md-3"><div class="card stat-card bg-success text-white"><div class="card-body"><div class="float-end"><i class="bi bi-box-seam opacity-50" style="font-size: 2rem;"></i></div><h6 class="text-white-80">产品数量</h6><h3 class="fw-bold" th:text="${productCount}">0</h3></div></div></div>
                    <div class="col-md-3"><div class="card stat-card bg-warning text-white"><div class="card-body"><div class="float-end"><i class="bi bi-receipt opacity-50" style="font-size: 2rem;"></i></div><h6 class="text-white-80">订单数量</h6><h3 class="fw-bold" th:text="${orderCount}">0</h3></div></div></div>
                    <div class="col-md-3"><div class="card stat-card bg-info text-white"><div class="card-body"><div class="float-end"><i class="bi bi-people opacity-50" style="font-size: 2rem;"></i></div><h6 class="text-white-80">用户数量</h6><h3 class="fw-bold" th:text="${userCount}">0</h3></div></div></div>
                </div>
                <div class="mt-4 card">
                    <div class="card-header"><h5><i class="bi bi-info-circle me-2"></i>快捷操作</h5></div>
                    <div class="card-body">
                        <div class="row g-3">
                            <div class="col-md-2"><button class="btn btn-primary w-100" onclick="showModal('category')"><i class="bi bi-plus-circle me-1"></i>添加分类</button></div>
                            <div class="col-md-2"><button class="btn btn-success w-100" onclick="showModal('product')"><i class="bi bi-plus-circle me-1"></i>添加产品</button></div>
                            <div class="col-md-2"><button class="btn btn-info w-100" onclick="showModal('banner')"><i class="bi bi-plus-circle me-1"></i>添加轮播</button></div>
                            <div class="col-md-2"><button class="btn btn-warning w-100" onclick="loadOrders()"><i class="bi bi-refresh me-1"></i>刷新订单</button></div>
                        </div>
                    </div>
                </div>
            </div>
            <div id="section-categories" class="content-section d-none">
                <div class="d-flex justify-content-between align-items-center mb-4"><h2><i class="bi bi-grid me-2"></i>分类管理</h2><button class="btn btn-primary" onclick="showModal('category')"><i class="bi bi-plus-circle me-1"></i>添加分类</button></div>
                <table class="table table-striped table-hover"><thead class="bg-dark text-white"><tr><th>分类ID</th><th>名称</th><th>描述</th><th>操作</th></tr></thead><tbody id="categoryTableBody"></tbody></table>
            </div>
            <div id="section-products" class="content-section d-none">
                <div class="d-flex justify-content-between align-items-center mb-4"><h2><i class="bi bi-box-seam me-2"></i>产品管理</h2><button class="btn btn-success" onclick="showModal('product')"><i class="bi bi-plus-circle me-1"></i>添加产品</button></div>
                <table class="table table-striped table-hover"><thead class="bg-dark text-white"><tr><th>图片</th><th>产品ID</th><th>分类</th><th>名称</th><th>价格</th><th>状态</th><th>描述</th><th>操作</th></tr></thead><tbody id="productTableBody"></tbody></table>
            </div>
            <div id="section-banners" class="content-section d-none">
                <div class="d-flex justify-content-between align-items-center mb-4"><h2><i class="bi bi-images me-2"></i>轮播图管理</h2><button class="btn btn-info" onclick="showModal('banner')"><i class="bi bi-plus-circle me-1"></i>添加轮播图</button></div>
                <table class="table table-striped table-hover"><thead class="bg-dark text-white"><tr><th>图片</th><th>标题</th><th>副标题</th><th>排序</th><th>状态</th><th>操作</th></tr></thead><tbody id="bannerTableBody"></tbody></table>
            </div>
            <div id="section-orders" class="content-section d-none">
                <div class="d-flex justify-content-between align-items-center mb-4"><h2><i class="bi bi-receipt me-2"></i>订单管理</h2><button class="btn btn-warning" onclick="loadOrders()"><i class="bi bi-refresh me-1"></i>刷新</button></div>
                <table class="table table-striped table-hover"><thead class="bg-dark text-white"><tr><th>订单ID</th><th>用户</th><th>日期</th><th>总价</th><th>状态</th><th>操作</th></tr></thead><tbody id="orderTableBody"></tbody></table>
            </div>
            <div id="section-users" class="content-section d-none">
                <div class="d-flex justify-content-between align-items-center mb-4"><h2><i class="bi bi-people me-2"></i>用户管理</h2><button class="btn btn-info" onclick="loadUsers()"><i class="bi bi-refresh me-1"></i>刷新</button></div>
                <table class="table table-striped table-hover"><thead class="bg-dark text-white"><tr><th>用户名</th><th>邮箱</th><th>姓名</th><th>角色</th><th>状态</th><th>操作</th></tr></thead><tbody id="userTableBody"></tbody></table>
            </div>
        </div>
    </div>
</div>
<div class="modal fade" id="dataModal" tabindex="-1">
    <div class="modal-dialog modal-lg"><div class="modal-content">
        <div class="modal-header"><h5 class="modal-title" id="modalTitle">添加数据</h5><button type="button" class="btn-close" data-bs-dismiss="modal"></button></div>
        <div class="modal-body"><form id="dataForm" enctype="multipart/form-data"><input type="hidden" id="formType"><input type="hidden" id="formId"><div id="formFields"></div></form></div>
        <div class="modal-footer"><button type="button" class="btn btn-secondary" data-bs-dismiss="modal">取消</button><button type="button" class="btn btn-primary" onclick="submitForm()">保存</button></div>
    </div></div>
</div>
<div class="modal fade" id="detailModal" tabindex="-1">
    <div class="modal-dialog modal-lg"><div class="modal-content">
        <div class="modal-header"><h5 class="modal-title" id="detailTitle">详情</h5><button type="button" class="btn-close" data-bs-dismiss="modal"></button></div>
        <div class="modal-body" id="detailContent"></div>
        <div class="modal-footer"><button type="button" class="btn btn-secondary" data-bs-dismiss="modal">关闭</button></div>
    </div></div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script><script>
let modalInstance = null;
document.addEventListener('DOMContentLoaded', function() {
    document.querySelectorAll('.nav-link[data-section]').forEach(a => {
        a.addEventListener('click', function(e) {
            e.preventDefault();
            document.querySelectorAll('.content-section').forEach(el => el.classList.add('d-none'));
            document.getElementById('section-' + this.dataset.section).classList.remove('d-none');
            document.querySelectorAll('.nav-link[data-section]').forEach(b => b.classList.remove('active'));
            this.classList.add('active');
        });
    });
    loadCategories(); loadProducts(); loadBanners(); loadOrders(); loadUsers();
});

function showModal(type, data = null) {
    document.getElementById('formType').value = type;
    document.getElementById('formId').value = data ? (type === 'category' ? data.catid : type === 'banner' ? data.id : data.productid) : '';
    const titles = {category: '分类', product: '产品', banner: '轮播图'};
    document.getElementById('modalTitle').textContent = data ? '编辑' + titles[type] : '添加' + titles[type];
    let fields = '';
    if (type === 'category') {
        fields = '<div class="mb-3"><label class="form-label">分类ID</label><input type="text" class="form-control" id="catid" ' + (data ? 'readonly' : 'required') + ' value="' + (data ? data.catid : '') + '"></div>' +
            '<div class="mb-3"><label class="form-label">名称</label><input type="text" class="form-control" id="name" required value="' + (data ? data.name : '') + '"></div>' +
            '<div class="mb-3"><label class="form-label">描述</label><textarea class="form-control" id="description">' + (data ? data.description : '') + '</textarea></div>';
    } else if (type === 'product') {
        const imgHtml = (data && data.image) ? '<img src="' + data.image + '" class="img-fluid rounded mb-2" style="max-height: 150px;" id="currentImage">' : '';
        const statusOpt = data && data.status === 'ON_SALE' ? 'selected' : '';
        const statusOpt2 = data && data.status === 'OFF_SALE' ? 'selected' : '';
        fields = '<div class="mb-3"><label class="form-label">产品ID</label><input type="text" class="form-control" id="productid" ' + (data ? 'readonly' : 'required') + ' value="' + (data ? data.productid : '') + '"></div>' +
            '<div class="mb-3"><label class="form-label">分类</label><select class="form-select" id="category" required></select></div>' +
            '<div class="mb-3"><label class="form-label">名称</label><input type="text" class="form-control" id="name" required value="' + (data ? data.name : '') + '"></div>' +
            '<div class="mb-3"><label class="form-label">价格 (元)</label><input type="number" class="form-control" id="price" step="0.01" min="0.01" value="' + (data && data.price != null ? data.price : '') + '"></div>' +
            '<div class="mb-3"><label class="form-label">状态</label><select class="form-select" id="status"><option value="ON_SALE" ' + statusOpt + '>在售</option><option value="OFF_SALE" ' + statusOpt2 + '>下架</option></select></div>' +
            '<div class="mb-3"><label class="form-label">描述</label><textarea class="form-control" id="description">' + (data ? data.description : '') + '</textarea></div>' +
            '<div class="mb-3"><label class="form-label">产品图片</label>' + imgHtml + '<input type="file" class="form-control" id="image" name="image" accept="image/*"></div>';
    } else if (type === 'banner') {
        const imgHtml = (data && data.image) ? '<img src="' + data.image + '" class="img-fluid rounded mb-2" style="max-height: 120px;" id="currentImage">' : '';
        const activeOpt = data && data.active ? 'selected' : '';
        const activeOpt2 = data && !data.active ? 'selected' : '';
        fields = '<div class="mb-3"><label class="form-label">标题</label><input type="text" class="form-control" id="bannerTitle" required value="' + (data ? data.title : '') + '"></div>' +
            '<div class="mb-3"><label class="form-label">副标题</label><input type="text" class="form-control" id="bannerSubtitle" value="' + (data ? (data.subtitle || '') : '') + '"></div>' +
            '<div class="mb-3"><label class="form-label">链接</label><input type="text" class="form-control" id="bannerLink" placeholder="/category/DOGS" value="' + (data ? (data.link || '') : '') + '"></div>' +
            '<div class="mb-3"><label class="form-label">排序</label><input type="number" class="form-control" id="bannerSortOrder" value="' + (data ? data.sortOrder : 0) + '"></div>' +
            '<div class="mb-3"><label class="form-label">状态</label><select class="form-select" id="bannerActive"><option value="true" ' + activeOpt + '>启用</option><option value="false" ' + activeOpt2 + '>禁用</option></select></div>' +
            '<div class="mb-3"><label class="form-label">轮播图片</label>' + imgHtml + '<input type="file" class="form-control" id="bannerImage" name="image" accept="image/*"></div>';
    }
    document.getElementById('formFields').innerHTML = fields;
    if (type === 'product') {
        fetch('/api/admin/categories').then(r => r.json()).then(r => {
            const sel = document.getElementById('category');
            r.data.forEach(c => { const o = document.createElement('option'); o.value = c.catid; o.textContent = c.name; if(data && data.category === c.catid) o.selected = true; sel.appendChild(o); });
        });
    }
    modalInstance = new bootstrap.Modal(document.getElementById('dataModal'));
    modalInstance.show();
}

function submitForm() {
    const type = document.getElementById('formType').value;
    const id = document.getElementById('formId').value;
    if (type === 'category') {
        fetch(id ? '/api/admin/categories/' + id : '/api/admin/categories', {
            method: id ? 'PUT' : 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ catid: document.getElementById('catid').value, name: document.getElementById('name').value, description: document.getElementById('description').value })
        }).then(r => r.json()).then(r => { if (r.code === 200) { modalInstance.hide(); loadCategories(); showAlert('操作成功', 'success'); } else { showAlert(r.message, 'danger'); } });
    } else if (type === 'product') {
        const fd = new FormData();
        fd.append('productid', document.getElementById('productid').value);
        fd.append('category', document.getElementById('category').value);
        fd.append('name', document.getElementById('name').value);
        fd.append('price', document.getElementById('price').value);
        fd.append('status', document.getElementById('status').value);
        fd.append('description', document.getElementById('description').value);
        const img = document.getElementById('image').files[0];
        if (img) fd.append('image', img);
        fetch(id ? '/api/admin/products/' + id : '/api/admin/products', { method: id ? 'PUT' : 'POST', body: fd })
            .then(r => r.json()).then(r => { if (r.code === 200) { modalInstance.hide(); loadProducts(); showAlert('操作成功', 'success'); } else { showAlert(r.message, 'danger'); } });
    } else if (type === 'banner') {
        const fd = new FormData();
        fd.append('title', document.getElementById('bannerTitle').value);
        fd.append('subtitle', document.getElementById('bannerSubtitle').value);
        fd.append('link', document.getElementById('bannerLink').value);
        fd.append('sortOrder', document.getElementById('bannerSortOrder').value);
        fd.append('active', document.getElementById('bannerActive').value);
        const img = document.getElementById('bannerImage').files[0];
        if (img) fd.append('image', img);
        fetch(id ? '/api/banners/' + id : '/api/banners', { method: id ? 'PUT' : 'POST', body: fd })
            .then(r => r.json()).then(r => { if (r.code === 200) { modalInstance.hide(); loadBanners(); showAlert('操作成功', 'success'); } else { showAlert(r.message, 'danger'); } });
    }
}function loadCategories() {
    fetch('/api/admin/categories').then(r => r.json()).then(r => {
        document.getElementById('categoryTableBody').innerHTML = r.data.map(c => '<tr><td>' + c.catid + '</td><td>' + c.name + '</td><td>' + c.description + '</td><td><button class="btn btn-sm btn-primary" onclick=\'showModal("category", ' + JSON.stringify(c).replace(/'/g,"\\'") + ')\'><i class="bi bi-pencil"></i></button><button class="btn btn-sm btn-danger ms-1" onclick="deleteItem(\'categories\',\'' + c.catid + '\')"><i class="bi bi-trash"></i></button></td></tr>').join('');
    });
}

function loadProducts() {
    fetch('/api/admin/products').then(r => r.json()).then(r => {
        document.getElementById('productTableBody').innerHTML = r.data.map(p => {
            const img = p.image ? '<img src="' + p.image + '" class="product-img-thumb">' : '<i class="bi bi-image text-muted"></i>';
            const badge = p.status === 'ON_SALE' ? '<span class="badge bg-success">在售</span>' : '<span class="badge bg-secondary">下架</span>';
            const toggle = p.status === 'ON_SALE' ? '<button class="btn btn-sm btn-warning ms-1" onclick="toggleProductStatus(\'' + p.productid + '\',\'OFF_SALE\')"><i class="bi bi-arrow-down-circle"></i> 下架</button>' : '<button class="btn btn-sm btn-success ms-1" onclick="toggleProductStatus(\'' + p.productid + '\',\'ON_SALE\')"><i class="bi bi-arrow-up-circle"></i> 上架</button>';
            return '<tr><td>' + img + '</td><td>' + p.productid + '</td><td>' + p.category + '</td><td>' + p.name + '</td><td><span class="fw-bold text-danger">¥' + (p.price ? parseFloat(p.price).toFixed(2) : '0.00') + '</span></td><td>' + badge + '</td><td>' + (p.description || '') + '</td><td><button class="btn btn-sm btn-primary" onclick=\'showModal("product",' + JSON.stringify(p).replace(/'/g,"\\'") + ')\'><i class="bi bi-pencil"></i></button><button class="btn btn-sm btn-danger ms-1" onclick="deleteItem(\'products\',\'' + p.productid + '\')"><i class="bi bi-trash"></i></button><button class="btn btn-sm btn-info ms-1" onclick="showProductDetail(\'' + p.productid + '\')"><i class="bi bi-eye"></i></button>' + toggle + '</td></tr>';
        }).join('');
    });
}

function loadBanners() {
    fetch('/api/banners').then(r => r.json()).then(r => {
        document.getElementById('bannerTableBody').innerHTML = r.data.map(b => {
            const img = b.image ? '<img src="' + b.image + '" class="banner-img-thumb">' : '<span class="text-muted">无图片</span>';
            return '<tr><td>' + img + '</td><td>' + b.title + '</td><td>' + (b.subtitle || '-') + '</td><td>' + (b.sortOrder || 0) + '</td><td>' + (b.active ? '<span class="badge bg-success">启用</span>' : '<span class="badge bg-secondary">禁用</span>') + '</td><td><button class="btn btn-sm btn-primary" onclick=\'showModal("banner",' + JSON.stringify(b) + ')\'><i class="bi bi-pencil"></i></button><button class="btn btn-sm btn-danger ms-1" onclick="deleteBanner(' + b.id + ')"><i class="bi bi-trash"></i></button></td></tr>';
        }).join('');
    });
}

function deleteBanner(id) { if (!confirm('确定要删除该轮播图吗？')) return; fetch('/api/banners/' + id, { method: 'DELETE' }).then(r => r.json()).then(r => { if (r.code === 200) { loadBanners(); showAlert('删除成功', 'success'); } else { showAlert(r.message, 'danger'); } }); }

function deleteItem(type, id) { if (!confirm('确定要删除吗？')) return; fetch('/api/admin/' + type + '/' + id, { method: 'DELETE' }).then(r => r.json()).then(r => { if (r.code === 200) { type === 'categories' ? loadCategories() : loadProducts(); showAlert('删除成功', 'success'); } else { showAlert(r.message, 'danger'); } }); }

function toggleProductStatus(id, st) { const a = st === 'ON_SALE' ? '上架' : '下架'; if (!confirm('确定要' + a + '该产品吗？')) return; fetch('/api/admin/products/' + id + '/status?status=' + st, { method: 'PUT' }).then(r => r.json()).then(r => { if (r.code === 200) { loadProducts(); showAlert(a + '成功', 'success'); } else { showAlert(r.message, 'danger'); } }); }

function showProductDetail(id) {
    fetch('/api/admin/products/' + id).then(r => r.json()).then(r => {
        const p = r.data;
        const img = p.image ? '<img src="' + p.image + '" class="img-fluid rounded mb-3" style="max-height:250px;">' : '<div class="bg-light rounded d-flex align-items-center justify-content-center mb-3" style="height:200px;"><i class="bi bi-image text-muted" style="font-size:3rem;"></i></div>';
        document.getElementById('detailTitle').textContent = p.name + ' - 产品详情';
        document.getElementById('detailContent').innerHTML = img + '<p><strong>产品ID：</strong>' + p.productid + '</p><p><strong>分类：</strong>' + p.category + '</p><p><strong>名称：</strong>' + p.name + '</p><p><strong>价格：</strong><span class="text-danger fw-bold">¥' + (p.price || '0.00') + '</span></p><p><strong>状态：</strong>' + (p.status === 'ON_SALE' ? '<span class="badge bg-success">在售</span>' : '<span class="badge bg-secondary">下架</span>') + '</p><p><strong>描述：</strong>' + (p.description || '无') + '</p>';
        new bootstrap.Modal(document.getElementById('detailModal')).show();
    });
}

function loadOrders() {
    fetch('/api/admin/orders').then(r => r.json()).then(r => {
        document.getElementById('orderTableBody').innerHTML = r.data.map(o => '<tr><td>' + o.orderid + '</td><td>' + o.userid + '</td><td>' + new Date(o.orderdate).toLocaleString() + '</td><td>¥' + o.totalprice + '</td><td><span class="badge ' + getOrderStatusClass(o.status) + '">' + getOrderStatusText(o.status) + '</span></td><td><button class="btn btn-sm btn-warning" onclick="updateOrderStatus(' + o.orderid + ",'" + o.status + '\')"><i class="bi bi-check-circle"></i> 更新状态</button><button class="btn btn-sm btn-info ms-1" onclick="showOrderDetail(' + o.orderid + ')"><i class="bi bi-eye"></i></button></td></tr>').join('');
    });
}

function loadUsers() {
    fetch('/api/admin/users').then(r => r.json()).then(r => {
        document.getElementById('userTableBody').innerHTML = r.data.map(u => '<tr><td>' + u.userid + '</td><td>' + u.email + '</td><td>' + u.firstname + ' ' + u.lastname + '</td><td><span class="badge ' + (u.role === 'ADMIN' ? 'bg-danger' : 'bg-info') + '">' + (u.role === 'ADMIN' ? '管理员' : '普通用户') + '</span></td><td>' + (u.status === 'OK' ? '<span class="badge bg-success">正常</span>' : '<span class="badge bg-danger">禁用</span>') + '</td><td><button class="btn btn-sm btn-primary" onclick="toggleUserRole(\'' + u.userid + "','" + u.role + '\')">切换角色</button><button class="btn btn-sm btn-danger ms-1" onclick="deleteUser(\'' + u.userid + '\')"><i class="bi bi-trash"></i></button></td></tr>').join('');
    });
}

function deleteUser(id) { if (!confirm('确定要删除该用户吗？')) return; fetch('/api/admin/users/' + id, { method: 'DELETE' }).then(r => r.json()).then(r => { if (r.code === 200) { loadUsers(); showAlert('删除成功', 'success'); } else { showAlert(r.message, 'danger'); } }); }

function toggleUserRole(id, role) { const nr = role === 'ADMIN' ? 'USER' : 'ADMIN'; fetch('/api/admin/users/' + id + '/role?role=' + nr, { method: 'PUT' }).then(r => r.json()).then(r => { if (r.code === 200) { loadUsers(); showAlert('角色更新成功', 'success'); } else { showAlert(r.message, 'danger'); } }); }

function updateOrderStatus(id, st) { const ss = ['P','A','S','C']; const idx = ss.indexOf(st); const ns = idx < ss.length - 1 ? ss[idx + 1] : 'P'; fetch('/api/admin/orders/' + id + '/status?status=' + ns, { method: 'PUT' }).then(r => r.json()).then(r => { if (r.code === 200) { loadOrders(); showAlert('状态更新成功', 'success'); } else { showAlert(r.message, 'danger'); } }); }

function showOrderDetail(id) {
    fetch('/api/admin/orders/' + id).then(r => r.json()).then(r => {
        const o = r.data; let html = ''; if (o.orderItems && o.orderItems.length > 0) { html = '<table class="table"><thead><tr><th>商品</th><th>数量</th><th>单价</th><th>小计</th></tr></thead><tbody>' + o.orderItems.map(i => '<tr><td>' + i.itemid + '</td><td>' + i.quantity + '</td><td>¥' + i.unitprice + '</td><td>¥' + (i.quantity * i.unitprice).toFixed(2) + '</td></tr>').join('') + '</tbody></table>'; }
        document.getElementById('detailTitle').textContent = '订单详情 - ' + id;
        document.getElementById('detailContent').innerHTML = '<p><strong>订单ID：</strong>' + o.orderid + '</p><p><strong>用户：</strong>' + o.userid + '</p><p><strong>日期：</strong>' + new Date(o.orderdate).toLocaleString() + '</p><p><strong>总价：</strong><span class="text-danger fw-bold">¥' + o.totalprice + '</span></p><p><strong>状态：</strong><span class="badge ' + getOrderStatusClass(o.status) + '">' + getOrderStatusText(o.status) + '</span></p><hr><h6>商品明细</h6>' + html;
        new bootstrap.Modal(document.getElementById('detailModal')).show();
    });
}

function getOrderStatusClass(s) { switch(s) { case 'P': return 'bg-warning'; case 'A': return 'bg-info'; case 'S': return 'bg-primary'; case 'C': return 'bg-success'; default: return 'bg-secondary'; } }
function getOrderStatusText(s) { switch(s) { case 'P': return '待处理'; case 'A': return '已确认'; case 'S': return '已发货'; case 'C': return '已完成'; default: return s; } }

function showAlert(msg, type) {
    const d = document.createElement('div'); d.className = 'alert alert-' + type + ' alert-dismissible fade show position-fixed';
    d.style.cssText = 'top:20px;right:20px;z-index:9999;min-width:250px;';
    d.innerHTML = msg + '<button type="button" class="btn-close" data-bs-dismiss="alert"></button>'; document.body.appendChild(d);
    setTimeout(() => d.remove(), 3000);
}
</script>

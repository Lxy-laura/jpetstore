<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>探索商品 - JPetStore</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
    <link th:href="@{/css/style.css}" rel="stylesheet">
    <link th:href="@{/css/chatbot.css}" rel="stylesheet">
</head>
<body>
<nav th:replace="~{fragments/header :: header}"></nav>
<main>
    <!-- Explore Hero -->
    <div class="bg-gradient-primary text-white py-5 mb-5" style="background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);">
        <div class="container">
            <div class="row align-items-center">
                <div class="col-lg-8">
                    <h1 class="display-5 fw-bold mb-3"><i class="bi bi-compass me-3"></i>探索所有商品</h1>
                    <p class="lead mb-0 opacity-90">发现你喜爱的宠物商品，小宠为你精选推荐</p>
                </div>
                <div class="col-lg-4 text-lg-end mt-3 mt-lg-0">
                    <span class="badge bg-light text-dark rounded-pill fs-6 px-4 py-2">
                        <i class="bi bi-box-seam me-2"></i>共 <strong th:text="${totalCount}">0</strong> 件商品
                    </span>
                </div>
            </div>
        </div>
    </div>

    <div class="container">
        <!-- Recommended Products (if available) -->
        <section class="mb-5" th:if="${not #lists.isEmpty(recommendations)}">
            <h2 class="page-title">
                <i class="bi bi-star-fill text-warning me-2"></i>为你推荐
                <small class="text-muted fs-6 ms-2">根据你的浏览偏好</small>
            </h2>
            <div class="row g-4">
                <div class="col-md-6 col-lg-3" th:each="product : ${recommendations}">
                    <div class="card product-card border-warning border-opacity-25">
                        <div class="card-img-top d-flex align-items-center justify-content-center bg-light position-relative" style="height: 180px;">
                            <img th:if="${product.image}" th:src="${product.image}" style="width:100%;height:100%;object-fit:cover;" th:alt="${product.name}">
                            <i th:unless="${product.image}" class="bi bi-image text-muted" style="font-size: 3rem;"></i>
                            <span class="badge bg-warning text-dark position-absolute top-0 end-0 m-2"><i class="bi bi-star-fill"></i> 推荐</span>
                            <span class="badge bg-danger position-absolute top-0 start-0 m-2" th:if="${product.status == 'ON_SALE'}"><i class="bi bi-fire"></i> 热卖</span>
                        </div>
                        <div class="card-body">
                            <span class="badge bg-primary badge-category mb-2" th:text="${product.category}">分类</span>
                            <h6 class="card-title" th:text="${product.name}">商品名称</h6>
                            <p class="card-text text-muted small" th:text="${#strings.abbreviate(product.description, 40)}">商品描述</p>
                            <div class="d-flex justify-content-between align-items-center">
                                <span class="price" th:text="'¥' + ${product.price}">¥0.00</span>
                                <a th:href="@{'/product/' + ${product.productid}}" class="btn btn-sm btn-gradient">
                                    <i class="bi bi-eye me-1"></i>查看详情
                                </a>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </section>

        <!-- All Products -->
        <section class="mb-5">
            <h2 class="page-title">
                <i class="bi bi-grid me-2"></i>全部商品
                <small class="text-muted fs-6 ms-2">浏览所有在售商品</small>
            </h2>
            <div class="row g-4">
                <div class="col-md-6 col-lg-4 col-xl-3" th:each="product : ${products}">
                    <div class="card product-card">
                        <div class="card-img-top d-flex align-items-center justify-content-center bg-light position-relative" style="height: 200px;">
                            <img th:if="${product.image}" th:src="${product.image}" style="width:100%;height:100%;object-fit:cover;" th:alt="${product.name}">
                            <i th:unless="${product.image}" class="bi bi-image text-muted" style="font-size: 3rem;"></i>
                            <div class="position-absolute top-0 start-0 m-2">
                                <span class="badge" th:classappend="${product.status == 'ON_SALE'} ? 'bg-success' : 'bg-secondary'" th:text="${product.status == 'ON_SALE'} ? '在售' : '已下架'">在售</span>
                            </div>
                        </div>
                        <div class="card-body">
                            <span class="badge bg-primary badge-category mb-2" th:text="${product.category}">分类</span>
                            <h5 class="card-title" th:text="${product.name}">商品名称</h5>
                            <p class="card-text text-muted small" th:text="${#strings.abbreviate(product.description, 50)}">商品描述</p>
                            <div class="d-flex justify-content-between align-items-center mt-2">
                                <span class="price" th:text="'¥' + ${product.price}">¥0.00</span>
                                <a th:href="@{'/product/' + ${product.productid}}" class="btn btn-sm btn-gradient">
                                    <i class="bi bi-eye me-1"></i>查看详情
                                </a>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
            <div class="empty-state" th:if="${#lists.isEmpty(products)}">
                <i class="bi bi-inbox d-block"></i>
                <h4>暂无商品</h4>
                <p>商品即将上架，敬请期待！</p>
            </div>
        </section>
        
        <!-- Navigation back -->
        <div class="text-center mb-5">
            <a th:href="@{/}" class="btn btn-outline-primary rounded-pill px-4">
                <i class="bi bi-house-door me-2"></i>返回首页
            </a>
        </div>
    </div>
</main>
<footer th:replace="~{fragments/header :: footer}"></footer>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
